yaml_version: 6

project:
  title:        "ALU de 2 bits (Suma, Resta y Comparacion)"
  author:       "angelyairr09-lab"
  discord:      ""
  description:  "ALU combinacional de 2 bits con operaciones simultaneas de comparacion, resta y suma."
  language:     "Verilog"
  clock_hz:     0

  tiles: "1x1"

  top_module:  "tt_um_alu_2bits"

  source_files:
    - "project.v"

pinout:
  # Entradas (ui[0] a ui[7])
  ui[0]: "A0 (Bit 0 operando A)"
  ui[1]: "A1 (Bit 1 operando A)"
  ui[2]: "B0 (Bit 0 operando B)"
  ui[3]: "B1 (Bit 1 operando B)"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Salidas (uo[0] a uo[7]) - Orden fijo Y0..Y7
  uo[0]: "Y0: A = B (Igualdad)"
  uo[1]: "Y1: A > B (Mayor que)"
  uo[2]: "Y2: R2 (Signo / Borrow resta)"
  uo[3]: "Y3: R1 (Bit 1 resta)"
  uo[4]: "Y4: R0 (Bit 0 resta)"
  uo[5]: "Y5: S2 (Acarreo suma)"
  uo[6]: "Y6: S1 (Bit 1 suma)"
  uo[7]: "Y7: S0 (Bit 0 suma)"

  # Pines bidireccionales (no usados)
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

